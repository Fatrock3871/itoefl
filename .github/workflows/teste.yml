name: Teste

# Roda o build e o smoke test em todo pull request para a main e em todo push na main.
# Sem segredos: só a URL e a chave PÚBLICA (publishable) do Supabase, em variáveis do
# repositório (Settings > Secrets and variables > Actions > Variables). O build.py lê as
# duas do ambiente quando não há app/supabase_config.json. Sem elas o site builda offline,
# sem login nem conta, e as checagens dessas telas reprovam.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # no job inteiro: o smoke test refaz o build sozinho e herda o ambiente
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependência do build
        run: python -m pip install markdown

      - name: Build do pipeline e do site
        run: |
          cd app
          python build_pipeline.py
          python build.py

      - name: Smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python scripts/smoke_test.py
