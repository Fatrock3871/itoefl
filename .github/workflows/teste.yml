name: Teste

# Roda o build e o smoke test em todo pull request para a main e em todo push na main.
# Sem segredos: o app roda em modo offline (sem app/supabase_config.json).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependência do build
        run: python -m pip install markdown

      - name: Build do pipeline e do site
        run: |
          cd app
          python build_pipeline.py
          python build.py

      - name: Smoke test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python scripts/smoke_test.py
