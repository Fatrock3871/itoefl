project_id = "itfosjcymqfzjsftvjey"

# O Mercado Pago chama o webhook sem nenhum header de autenticação. Com a
# verificação de JWT ligada (o padrão), o gateway do Supabase devolve 401
# antes de o código rodar e nenhum pagamento libera acesso. A segurança do
# webhook vem de reconferir o pagamento na API do Mercado Pago, não do JWT.
[functions.mp-webhook]
verify_jwt = false

# As outras quatro são chamadas pelo site com o token do aluno, e cada uma
# confere esse token no próprio código (auth.getUser) antes de fazer qualquer
# coisa. A verificação do gateway fica desligada porque ela só entende JWT
# assinado pelo segredo antigo do projeto: no dia em que a assinatura passar
# para as chaves novas (JWT Signing Keys), ela recusaria todo aluno. Guia do
# Supabase: docs/guides/getting-started/migrating-to-new-api-keys, passo 4.
[functions.create-checkout]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.submit-essay]
verify_jwt = false

[functions.review-essay]
verify_jwt = false
